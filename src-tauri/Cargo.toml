[package]
name = "dealdrop"
version = "0.10.0"
description = "Game sale, giveaway & wishlist notifier"
edition = "2021"
license = "MIT"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "http2"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
futures = "0.3"
url = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
