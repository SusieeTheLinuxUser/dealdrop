# Windows .msi + macOS .dmg (Intel + Apple Silicon), attached to an EXISTING release.
# The Linux AppImage is built locally first (see AGENTS.md "Releasing"); once it's tested, run:
#   gh workflow run release.yml -f tag=vX.Y.Z
name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the Windows and macOS builds to
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles msi
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo install tauri-cli --version "^2" --locked
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          tagName: ${{ inputs.tag }}
          releaseName: DealDrop ${{ inputs.tag }}
          args: ${{ matrix.args }}
